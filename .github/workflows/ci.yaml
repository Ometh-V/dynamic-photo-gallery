name: CI

on:
  pull_request:
  push:
    branches:
      - Adding-CI


jobs:
  test-container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t photo-app:${{ github.sha }} .

      - name: Run app
        run: |
          docker run -d -p 3000:3000 photo-app:${{ github.sha }}

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Authenticate ngrok
        run: ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}

      - name: Start ngrok tunnel and print URL
        run: |
          ngrok http 8080 --log=stdout > ngrok.log &
          sleep 5
          curl -s http://localhost:4040/api/tunnels | tee tunnel.json
          cat tunnel.json | grep -o '"public_url":"[^"]*' | cut -d'"' -f4

      - name: Keep tunnel alive (for testing duration)
        run: sleep 300   # 5 minutes — adjust as needed